name: checks

# What a change to this plugin has to survive before it can be merged.
#
# Everything here is cheap and deterministic: it parses files and compares them with
# each other. There is no OPNsense to install on a GitHub runner and no appliance to
# measure, so this does not pretend to test behaviour - it catches the mistakes that
# have actually happened while this plugin's family was being written:
#
#   * a template that no longer compiles, which takes the whole page to the crash
#     reporter and tells the reader nothing;
#   * a shell script or Python file with a syntax error, found after it was installed;
#   * a string added to the page, a form, the model, the menu or a data file and never
#     translated, which shows up as one English sentence in the middle of an Arabic page;
#   * an address from the machine this was written on, left in an example.
#
# And one this plugin adds: a rule the hook registers that pfctl would refuse. pfctl
# refuses the whole rule set for one bad rule, every rule of the owner's with it, so the
# rules are written out here by OPNsense's own classes - of 26.7, which has no key of its
# own for pf's scrub options, and of 26.7.9, which has - and checked against pfctl's grammar.
# And what the switch of an XGS appliance is given: the classes' queues, their minimums and
# what of Firewall: Shaper the switch can follow, decided here and set by os-xgs-npu.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-releases:
    name: signed releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A release is installed only as its owner signed it (SIGNED RELEASES in self-update.py):
      # what a check takes and refuses, and what an update installs. OpenSSL is the runner's.
      - name: self-update.py takes a release only as signed
        run: python3 tools/test-self-update.py

  rules:
    name: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # OPNsense's rule classes as each release has them, read and run by the test, nothing else of
      # opnsense/core: Plugin, FilterRule, Rule and Util.
      - name: OPNsense 26.7's rule classes
        uses: actions/checkout@v7
        with:
          repository: opnsense/core
          ref: '26.7'
          path: core-26.7
          persist-credentials: false
          sparse-checkout: src/opnsense/mvc/app/library/OPNsense/Firewall

      - name: OPNsense 26.7.9's rule classes
        uses: actions/checkout@v7
        with:
          repository: opnsense/core
          ref: '26.7.9'
          path: core-26.7.9
          persist-credentials: false
          sparse-checkout: src/opnsense/mvc/app/library/OPNsense/Firewall

      # The rules plugins.inc.d/trafficpriority.inc registers for sample classes, as OPNsense writes
      # them into /tmp/rules.debug: match rules, never quick, before every rule of OPNsense's, the
      # DSCP as pf's scrub option, nothing written for a class pfctl would refuse.
      - name: The rules hook, with OPNsense 26.7's classes
        run: OPNSENSE_CORE=core-26.7/src php tools/test-rules.php

      - name: The rules hook, with OPNsense 26.7.9's classes
        run: OPNSENSE_CORE=core-26.7.9/src php tools/test-rules.php

      # What the model refuses at the save - a class the hook would not write, read whole when any
      # field of it changed - and what the page's API answers, with stand-ins for OPNsense's MVC base.
      - name: The model and the page's API, with OPNsense 26.7's classes
        run: OPNSENSE_CORE=core-26.7/src php tools/test-mvc.php

      - name: The model and the page's API, with OPNsense 26.7.9's classes
        run: OPNSENSE_CORE=core-26.7.9/src php tools/test-mvc.php

      # The model's fields of the other plugins' lists: the groups and users of os-useridentity, and the
      # applications and categories os-appcontrol keeps a table for, read from the configuration.
      - name: "Groups and users, applications and categories offered from the other plugins' own lists"
        run: php tools/test-fields.php

      # status.py's reading of the rules pf was given and of pf's own counters, by each class's label.
      - name: The page says what pf holds of each class
        run: python3 tools/test-status.py

      # sources.py: the tables of os-useridentity's groups and users and os-appcontrol's applications and
      # categories a class names, found in config.xml as the rules hook's Sources.php finds them - the same
      # cases as tools/test-rules.php - each one's table, or why it has none.
      - name: The other plugins' tables a class names
        run: python3 tools/test-sources.py

      # hardware.py: which classes have a place in an XGS appliance's switch queues - two DSCPs, in the
      # page's order - which queue each takes, strict or weighted, the ports' scheduling, and the chip's
      # one weight sequence from the minimums: each queue its share of turns, every queue at least one.
      - name: The classes in the switch's queues, and their minimums
        run: python3 tools/test-hardware.py

      # shaper_map.py: Firewall: Shaper's pipes, queues and rules, read and never written, followed into
      # the switch where it can do what a rule does - a pipe's bandwidth as a front port's egress limit, a
      # queue's weight as a part of every port for a DSCP a class marks - and for every other rule why it
      # stays with the host.
      - name: "Firewall: Shaper followed, rule by rule"
        run: python3 tools/test-shaper-map.py

      # apply.py with a stand-in for os-xgs-npu's switch tool: the settings file written and applied, a
      # refusal said, what the plugin set put back when it is off or removed, another plugin's left alone.
      - name: The switch set from Apply, and put back
        run: python3 tools/test-apply.py

      # The page's script under node, with stand-ins for jQuery and OPNsense's page helpers: the tables of a
      # class's groups and users, applications and categories, a class with no table on one side, and the
      # lines that say os-useridentity or os-appcontrol is not installed. GitHub's runners have node.
      - name: "The page: each class's tables, and the other plugins not installed"
        run: python3 tools/test-page.py

      # install/install.sh copies src/ whole; install/uninstall.sh names what it removes.
      - name: Every file the installer lays down is removed by the uninstaller
        run: sh tools/check-uninstall.sh .

      # The installer, the removal, the package's scripts and place-menu.sh, run in a temporary root
      # with stand-ins for service, configctl and pfctl: what they lay down and take away, where the
      # menu goes, and that the rules hook is gone before the reload that takes its rules out of pf.
      - name: Install, removal and menu, in a temporary root
        run: python3 tools/test-install.py

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.py tools/**/*.py)
          [ ${#files[@]} -gt 0 ] || { echo "no Python here"; exit 0; }
          python3 -m compileall -q "${files[@]}"
          # compileall is the parser; this is the part it does not do - a name used and
          # never defined, an import that is not there. Both have shipped before.
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes "${files[@]}"

      - name: PHP
        run: |
          shopt -s globstar nullglob
          # .inc too: plugins.inc.d's rules hook is PHP that every filter reload includes, and an
          # error in it stops them all; and the test, which is PHP the checks run.
          files=(src/**/*.php src/**/*.inc tools/**/*.php)
          [ ${#files[@]} -gt 0 ] || { echo "no PHP here"; exit 0; }
          for f in "${files[@]}"; do php -l "$f"; done

      - name: XML
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.xml)
          [ ${#files[@]} -gt 0 ] || { echo "no XML here"; exit 0; }
          for f in "${files[@]}"; do
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$f"
            echo "ok $f"
          done

      # Well-formed is not enough for one of those files. A comment inside a widget's
      # <translations> element reaches gettext() as a value; two of them reach it as an
      # array, and the TypeError that follows empties every dashboard in the GUI with
      # nothing in any log naming the file.
      - name: Widget metadata
        run: |
          [ -f tools/check-widget-metadata.py ] || { echo "no widget here"; exit 0; }
          python3 tools/check-widget-metadata.py .

      - name: JSON
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.json)
          [ ${#files[@]} -gt 0 ] || { echo "no JSON here"; exit 0; }
          for f in "${files[@]}"; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f"
            echo "ok $f"
          done

      - name: Shell
        run: |
          shopt -s globstar nullglob
          # install/ is run by the person installing, src/etc/rc.d is run by the system
          # at boot, pkg/ is run by pkg(8) as root in the middle of an install or a
          # removal, and tools/ is run on the firewall by whoever is building a package.
          # Every one of them is a place where a syntax error is found too late.
          for f in install/*.sh tools/*.sh pkg/*.sh src/etc/rc.d/* src/etc/rc.syshook.d/**/* src/opnsense/scripts/**/*.sh; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -q '^#!' || continue
            sh -n "$f" && echo "ok $f"
          done

  privacy:
    name: nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No real addresses, hardware identifiers or credentials
        run: python3 tools/check-private-data.py .
      - name: Every source file carries the copyright line
        run: python3 tools/add-copyright.py

      # Arabic belongs in the catalogue and nowhere else: a sentence written straight
      # into a template cannot be reviewed by somebody who does not read it, cannot be
      # changed without touching code, and is invisible to anything that counts what
      # still needs translating.
      - name: No Arabic outside the translation files
        run: python3 tools/check-code-language.py .

  translations:
    name: translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Text that lives in a data file reaches the page through a generated map. A note
      # added to a JSON file and not regenerated here comes out in English on an Arabic
      # page, and nothing in the build says so.
      - name: The generated data-string map is current
        run: |
          [ -f tools/gen-data-strings.py ] || { echo "not this plugin"; exit 0; }
          python3 tools/gen-data-strings.py --check

      # The page's lang._(), the forms' labels, help and hints, the model's messages and options, the
      # menu, the ACL and the PHP's gettext(): each string OPNsense passes through gettext is in
      # source.json, and has its Arabic in opnsense-arabic.
      - name: Every string the GUI shows is in the catalogue
        # A contributor's pull request (from a fork) and main may carry a string whose Arabic follows
        # later (CONTRIBUTING.md): a warning there; on a branch of this repository a failure, as before.
        env:
          ARABIC_LATER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && '1' || '' }}
        run: |
          [ -f tools/check-strings.py ] || { echo "not this plugin"; exit 0; }
          python3 tools/check-strings.py
