#
# The page's question - "status check" reads the switch again too - and its Apply's second half.
# errors:no: each script prints a JSON answer and exits 0, and this keeps the answer if one ever does
# not. The page's Apply runs OPNsense's own "filter reload skip_alias", whose hook
# (plugins.inc.d/trafficpriority.inc) registers the classes' rules, and then, in the background, apply:
# the switch's queues on an XGS 3300, through os-xgs-npu's switch tool where there is one
# (scripts/trafficpriority/apply.py), which keeps what it did for status.

[status]
command:/usr/local/opnsense/scripts/trafficpriority/status.py
parameters:%s
errors:no
type:script_output
message:reading what Traffic Priority applied

[apply]
command:/usr/local/opnsense/scripts/trafficpriority/apply.py
parameters:
errors:no
type:script_output
message:setting the switch queues of Traffic Priority
