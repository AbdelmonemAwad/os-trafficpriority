#
# The page's question. errors:no: the script prints a JSON answer and exits 0, and this keeps the
# answer if it ever does not. The page's Apply runs OPNsense's own "filter reload skip_alias", whose
# hook (plugins.inc.d/trafficpriority.inc) registers the classes' rules; nothing of this plugin's runs
# for it.

[status]
command:/usr/local/opnsense/scripts/trafficpriority/status.py
parameters:
errors:no
type:script_output
message:reading what Traffic Priority applied
