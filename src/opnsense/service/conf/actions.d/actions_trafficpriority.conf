#
# The page's question, and its Apply's second half. errors:no: each script prints a JSON answer and
# exits 0, and this keeps the answer if one ever does not. The page's Apply runs OPNsense's own "filter
# reload skip_alias", whose hook (plugins.inc.d/trafficpriority.inc) registers the classes' rules, and
# then apply: the switch's queues on an XGS appliance, through os-xgs-npu's switch tool where there is
# one (scripts/trafficpriority/apply.py).

[status]
command:/usr/local/opnsense/scripts/trafficpriority/status.py
parameters:
errors:no
type:script_output
message:reading what Traffic Priority applied

[apply]
command:/usr/local/opnsense/scripts/trafficpriority/apply.py
parameters:
errors:no
type:script_output
message:setting the switch queues of Traffic Priority
